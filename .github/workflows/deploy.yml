name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Validate JSON data
        run: |
          echo "Vérification du fichier data.json..."
          python3 -m json.tool data.json > /dev/null
          echo "✓ JSON valide"

      - name: 📋 Validate HTML
        run: |
          echo "Vérification du fichier HTML..."
          test -f index.html && echo "✓ index.html trouvé"
          test -f styles.css && echo "✓ styles.css trouvé"
          test -f script.js && echo "✓ script.js trouvé"
          test -f data.json && echo "✓ data.json trouvé"

      - name: 🌐 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: false

      - name: ✨ Deployment Success
        run: |
          echo "✅ Déploiement réussi!"
          echo "🌐 Site accessible à: https://chaps-boop.github.io/Formos/"
